# CI — typecheck, lint, boundary lint, boundary self-test, test, build.
#
# Runs on every PR (any branch) and on pushes to long-lived branches only.
# Story branches emit a `pull_request` event via PR #17-style workflow, so
# a story push doesn't need a duplicate `push` run.
name: CI

on:
  push:
    # Only long-lived integration/deploy branches — avoids the duplicate
    # push + pull_request runs on story branches (Delivery Guardian #3).
    branches: [main, 'feat/**']
  pull_request:
    branches: ['**']

# Cancel superseded runs on the same ref — solo repo, no reason to spend CI on
# obsolete pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Wall-clock cap: the whole pipeline runs in ~30s today; 10 min is a
    # generous ceiling that still contains any hung dev-server / infinite
    # loop introduced by later stories (Delivery Guardian #2).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint boundaries (dependency-cruiser)
        run: npm run lint:boundaries

      - name: Boundary rule self-test
        # Executes fixture violations against every boundary rule and
        # asserts each one fires. Blocks CI if a rule ever silently
        # degrades to no-op (as `includeOnly: ^src/` did in S1 review).
        run: npm run test:boundaries

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build
